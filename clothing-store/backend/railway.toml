# Use this file when Railway Root Directory is set to: clothing-store/backend
# Dashboard → Service → Settings → Root Directory = clothing-store/backend
# Config file path (absolute from repo root): /clothing-store/backend/railway.toml

[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"
watchPatterns = ["/clothing-store/backend/**"]

[deploy]
startCommand = "npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
