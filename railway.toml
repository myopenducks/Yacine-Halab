# Repo-root config for Railway (monorepo: API is in clothing-store/backend).
# Docs: https://docs.railway.com/deployments/monorepo

[build]
builder = "RAILPACK"
buildCommand = "npm ci --prefix clothing-store/backend && npm run build --prefix clothing-store/backend"
watchPatterns = ["clothing-store/backend/**"]

[deploy]
startCommand = "npm run start --prefix clothing-store/backend"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
